name: Build packages

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix. image }}
    env:
      CLANG_VERSION: 23.1.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2026
            image: windows-2025-vs2026
          - name: vs2022
            image: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove conflicting copies of make
        # The runners include a copy of mingw64, and explicitly add mingw64's copy of make.exe to PATH. This
        # will cause the build to fail.  Remove mingw64 alltogether.
        # See https://github.com/actions/runner-images/blob/main/images/windows/scripts/build/Install-Mingw64.ps1#L63-L67
        # The same goes for C:\Strawberry\*\bin, which contains copy of make, pkg-config, and gdb
        shell: cmd
        run: |
          rmdir /q /s C:\mingw64\bin\
          rmdir /q /s C:\Strawberry\c\bin\
          rmdir /q /s C:\Strawberry\perl\bin\
      - name: Install Clang
        run: choco upgrade llvm -y --version=$env:CLANG_VERSION
      - name: Check LLVM, Cmake version
        # We need at least LLVM 18.0 for proper Objective C support.  Visual Studio 2022 ships with LLVM 17,
        # so we need to make sure we pick up clang from C:\Program Files\LLVM\bin\
        # For full-fledged support on Windows, we'll need https://github.com/llvm/llvm-project/pull/107604,
        # which will is included in LLVM 20.0.  The windows-2025 GitHub Actions image has this version of clang;
        # trust but verify
        run: |
          clang --version
          cmake --version
      - name: Install Conan
        run: |
          pip install conan==2.33.0
          pip install pygit2
          conan --version
          conan config install global.conf
          conan remote add gitlab https://gitlab.com/api/v4/projects/72962159/packages/conan
      - name: Mark path as safe
        run: git config --global --add safe.directory $(pwd)
      - name: Check out main branch
        run: |
          git branch $env:GITHUB_BASE_REF origin/$env:GITHUB_BASE_REF
          git show-ref
        if: ${{ github.ref != 'refs/heads/main' }}
      - name: Create gnustep-helpers
        run: conan create gnustep-helpers --profile:a=${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}
      - name: Create getopt
        run: conan create getopt --profile:a=${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}
      - name: Build external dependencies
        # Builds the dependencies which are not part of the workspace (and which are not available as binaries) and
        # records what was built in the graph, so we can upload exactly those packages later on.
        run: conan workspace super-install --profile:a=${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }} -c tools.build:skip_test=True --build=missing --lockfile=${{ github.workspace }}/conan.lock --lockfile-partial --output-folder=${{ runner.temp }}/super-install --format=json --out-file=${{ runner.temp }}/graph.json
      - name: Create gnustep
        run: conan workspace create --profile:a=${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }} -c tools.build:skip_test=True --build=missing --lockfile=${{ github.workspace }}/conan.lock --lockfile-partial
      - name: Build tutorial
        run: |
          conan install conanfile.txt --profile:a=../profiles/windows-clang-${{ matrix.name }} --output-folder=build/ --conf="tools.env.virtualenv:powershell=pwsh.exe" --lockfile=../conan.lock --lockfile-partial
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_POLICY_DEFAULT_CMP0091="NEW" -GNinja
          cmake --build build
          ./build/conanrun.ps1
          ./build/Tutorial.exe
        working-directory: tutorial/
      - name: List external packages which were built locally
        run: |
          conan list --graph=${{ runner.temp }}/graph.json --graph-binaries=build --format=json --out-file=${{ runner.temp }}/built.json
          python -c "import json; names = sorted(json.load(open(r'${{ runner.temp }}/built.json'))['Local Cache']); print('\n'.join(names) if names else 'No external packages were built')"
      - name: Check for outdated dependencies
        run: conan graph outdated conanfile.txt --profile:a=../profiles/windows-clang-${{ matrix.name }} --lockfile=../conan.lock --lockfile-partial
        working-directory: tutorial/
      - name: Upload Conan packages to Cloudsmith
        run: |
          conan remote add cloudsmith https://conan.cloudsmith.io/qmfrederik/gnustep/
          conan remote login -p ${{ secrets.CLOUDSMITH_API_KEY }} cloudsmith ${{ secrets.CLOUDSMITH_USER }}
          conan upload libobjc2/* --confirm -r cloudsmith
          conan upload libdispatch/* --confirm -r cloudsmith
          conan upload gnustep*/* --confirm -r cloudsmith
          conan upload getopt/* --confirm -r cloudsmith
          conan upload --list=${{ runner.temp }}/built.json --confirm -r cloudsmith
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload Conan packages to GitLab
        run: |
          conan remote login -p ${{ secrets.GITLAB_API_KEY }} gitlab ${{ secrets.GITLAB_USER }}
          conan upload libobjc2/* --confirm -r gitlab
          conan upload libdispatch/* --confirm -r gitlab
          conan upload gnustep*/* --confirm -r gitlab
          conan upload getopt/* --confirm -r gitlab
          conan upload --list=${{ runner.temp }}/built.json --confirm -r gitlab
        if: ${{ github.ref == 'refs/heads/main' }}
      # This can help troubleshooting when Conan packages fail to build because the repository is dirty
      - name: Get Git status
        run: |
          git status
        if: always()
      - name: Upload Conan cache to GitHub artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conan-gnustep-windows
          path: |
            ~/.conan2/p
            !~/.conan2/p/msys2*

  linux:
    runs-on: ubuntu-latest
    env:
      CLANG_VERSION: 23
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
            family: ubuntu
    steps:
      - name: Add LLVM apt repository (Ubuntu)
        run: |
          apt-get update
          apt-get install -y ca-certificates curl
          install -d /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${CLANG_VERSION} main" > /etc/apt/sources.list.d/llvm.list
        if: matrix.family == 'ubuntu'
      - name: Add Kitware apt repository (Ubuntu)
        run: |
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc -o /etc/apt/keyrings/kitware-archive.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/kitware-archive.asc] https://apt.kitware.com/ubuntu/ ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/kitware.list
        if: matrix.family == 'ubuntu'
      - name: Install dependencies (Ubuntu)
        run: |
          apt-get update
          apt-get install -y gobjc-13 libstdc++-13-dev clang-${CLANG_VERSION} lld-${CLANG_VERSION} curl zip unzip tar git pkg-config make python3-venv cmake
          # We need these packages in case we're building cairo
          apt-get install -y libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxinerama-dev libxkbfile-dev libxmuu-dev libxrandr-dev libxres-dev libxss-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-xinerama0-dev libxcb-dri3-dev uuid-dev libxcb-cursor-dev libxcb-dri2-0-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev
          # The Conan profile expects /usr/bin/clang and /usr/bin/clang++
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
        if: matrix.family == 'ubuntu'
      - name: Check LLVM, Cmake version
        run: |
          clang --version
          cmake --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install conan
        run: |
          python3 -m venv .python3/
          .python3/bin/pip install conan==2.33.0
          .python3/bin/pip install pygit2
          .python3/bin/conan --version
          .python3/bin/conan config install global.conf
          .python3/bin/conan remote add gitlab https://gitlab.com/api/v4/projects/72962159/packages/conan
      - name: Mark path as safe
        run: git config --global --add safe.directory $(pwd)
      - name: Check out main branch
        run: |
          git branch $GITHUB_BASE_REF origin/$GITHUB_BASE_REF
          git show-ref
        if: ${{ github.ref != 'refs/heads/main' }}
      - name: Install gnustep-helpers
        run: .python3/bin/conan create gnustep-helpers --profile:a=profiles/linux-clang-nodist
      - name: Build external dependencies
        # Builds the dependencies which are not part of the workspace (and which are not available as binaries) and
        # records what was built in the graph, so we can upload exactly those packages later on.
        run: .python3/bin/conan workspace super-install --profile:a=profiles/linux-clang-nodist -c tools.build:skip_test=True --build=missing --lockfile=conan.lock --lockfile-partial --output-folder=${{ runner.temp }}/super-install --format=json --out-file=${{ runner.temp }}/graph.json
      - name: Create gnustep
        run: .python3/bin/conan workspace create --profile:a=profiles/linux-clang-nodist -c tools.build:skip_test=True --build=missing --lockfile=conan.lock --lockfile-partial
      - name: Build tutorial
        run: |
          ../.python3/bin/conan install conanfile.txt --profile:a=../profiles/linux-clang-nodist --output-folder=build/ --lockfile=../conan.lock --lockfile-partial
          cmake -S . -B build/ -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          . build/conanrun.sh
          ./build/Tutorial
        working-directory: tutorial/
      - name: List external packages which were built locally
        run: |
          .python3/bin/conan list --graph=${{ runner.temp }}/graph.json --graph-binaries=build --format=json --out-file=${{ runner.temp }}/built.json
          .python3/bin/python -c "import json; names = sorted(json.load(open(r'${{ runner.temp }}/built.json'))['Local Cache']); print('\n'.join(names) if names else 'No external packages were built')"
      - name: Check for outdated dependencies
        run: ../.python3/bin/conan graph outdated conanfile.txt --profile:a=../profiles/linux-clang-nodist --lockfile=../conan.lock --lockfile-partial
        working-directory: tutorial/
      - name: Upload Conan packages to Cloudsmith
        run: |
          .python3/bin/conan remote add cloudsmith https://conan.cloudsmith.io/qmfrederik/gnustep/
          .python3/bin/conan remote login -p ${{ secrets.CLOUDSMITH_API_KEY }} cloudsmith ${{ secrets.CLOUDSMITH_USER }}
          .python3/bin/conan upload "libobjc2/*" --confirm -r cloudsmith
          .python3/bin/conan upload "libdispatch/*" --confirm -r cloudsmith
          .python3/bin/conan upload "gnustep*/*" --confirm -r cloudsmith
          .python3/bin/conan upload --list=${{ runner.temp }}/built.json --confirm -r cloudsmith
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload Conan packages to GitLab
        run: |
          .python3/bin/conan remote login -p ${{ secrets.GITLAB_API_KEY }} gitlab ${{ secrets.GITLAB_USER }}
          .python3/bin/conan upload "libobjc2/*" --confirm -r gitlab
          .python3/bin/conan upload "libdispatch/*" --confirm -r gitlab
          .python3/bin/conan upload "gnustep*/*" --confirm -r gitlab
          .python3/bin/conan upload --list=${{ runner.temp }}/built.json --confirm -r gitlab
        if: ${{ github.ref == 'refs/heads/main' }}
