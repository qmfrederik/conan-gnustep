name: Build packages

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix. image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2026
            image: windows-2025-vs2026
          - name: vs2022
            image: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove conflicting copies of make
        # The runners include a copy of mingw64, and explicitly add mingw64's copy of make.exe to PATH. This
        # will cause the build to fail.  Remove mingw64 alltogether.
        # See https://github.com/actions/runner-images/blob/main/images/windows/scripts/build/Install-Mingw64.ps1#L63-L67
        # The same goes for C:\Strawberry\*\bin, which contains copy of make, pkg-config, and gdb
        shell: cmd
        run: |
          rmdir /q /s C:\mingw64\bin\
          rmdir /q /s C:\Strawberry\c\bin\
          rmdir /q /s C:\Strawberry\perl\bin\
      - name: Check LLVM, Cmake version
        # We need at least LLVM 18.0 for proper Objective C support.  Visual Studio 2022 ships with LLVM 17,
        # so we need to make sure we pick up clang from C:\Program Files\LLVM\bin\
        # For full-fledged support on Windows, we'll need https://github.com/llvm/llvm-project/pull/107604,
        # which will is included in LLVM 20.0.  The windows-2025 GitHub Actions image has this version of clang;
        # trust but verify
        run: |
          clang --version
          cmake --version
      - name: Install Conan
        run: |
          pip install conan==2.33.0
          pip install pygit2
          conan --version
          conan config install global.conf
      - name: Mark path as safe
        run: git config --global --add safe.directory $(pwd)
      - name: Check out main branch
        run: |
          git branch $env:GITHUB_BASE_REF origin/$env:GITHUB_BASE_REF
          git show-ref
        if: ${{ github.ref != 'refs/heads/main' }}
      - name: Install gnustep-helpers
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-helpers'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install libdispatch
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'libdispatch'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install libobjc2
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'libobjc2'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep-make
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-make'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep-base
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-base'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep-gui
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-gui'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep-headless
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-headless'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep-back
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-back'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep-systempreferences
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep-systempreferences'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install gnustep
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'gnustep'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Install getopt
        uses: ./.github/actions/conan-create
        with:
          conan-package: 'getopt'
          profile: '${{ github.workspace }}/profiles/windows-clang-${{ matrix.name }}'
      - name: Build tutorial
        run: |
          conan install conanfile.txt --profile:a=../profiles/windows-clang-${{ matrix.name }} --output-folder=build/ --conf="tools.env.virtualenv:powershell=pwsh.exe"
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_POLICY_DEFAULT_CMP0091="NEW" -GNinja
          cmake --build build
          ./build/conanrun.ps1
          ./build/Tutorial.exe
        working-directory: tutorial/
      - name: Upload Conan packages to Cloudsmith
        run: |
          conan remote add cloudsmith https://conan.cloudsmith.io/qmfrederik/gnustep/
          conan remote login -p ${{ secrets.CLOUDSMITH_API_KEY }} cloudsmith ${{ secrets.CLOUDSMITH_USER }}
          conan upload libobjc2/* --confirm -r cloudsmith
          conan upload libdispatch/* --confirm -r cloudsmith
          conan upload gnustep*/* --confirm -r cloudsmith
          conan upload getopt/* --confirm -r cloudsmith
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload Conan packages to GitLab
        run: |
          conan remote add gitlab https://gitlab.com/api/v4/projects/72962159/packages/conan
          conan remote login -p ${{ secrets.GITLAB_API_KEY }} gitlab ${{ secrets.GITLAB_USER }}
          conan upload libobjc2/* --confirm -r gitlab
          conan upload libdispatch/* --confirm -r gitlab
          conan upload gnustep*/* --confirm -r gitlab
          conan upload getopt/* --confirm -r gitlab
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload Conan cache to GitHub artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conan-gnustep-windows-${{ matrix.name }}
          path: |
            ~/.conan2/p
            !~/.conan2/p/msys2*
      - name: Upload Conan graph to GitHub artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conan-gnustep-windows-${{ matrix.name }}-graph
          path: |
            ./*.json

  linux:
    runs-on: ubuntu-latest
    env:
      CLANG_VERSION: 23
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
            family: ubuntu
    steps:
      - name: Add LLVM apt repository (Ubuntu)
        run: |
          apt-get update
          apt-get install -y ca-certificates curl
          install -d /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${CLANG_VERSION} main" > /etc/apt/sources.list.d/llvm.list
        if: matrix.family == 'ubuntu'
      - name: Add Kitware apt repository (Ubuntu)
        run: |
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc -o /etc/apt/keyrings/kitware-archive.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/kitware-archive.asc] https://apt.kitware.com/ubuntu/ ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/kitware.list
        if: matrix.family == 'ubuntu'
      - name: Install dependencies (Ubuntu)
        run: |
          apt-get update
          apt-get install -y gobjc-13 libstdc++-13-dev clang-${CLANG_VERSION} lld-${CLANG_VERSION} curl zip unzip tar git pkg-config make python3-venv cmake
          # The Conan profile expects /usr/bin/clang and /usr/bin/clang++
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
        if: matrix.family == 'ubuntu'
      - name: Check LLVM, Cmake version
        run: |
          clang --version
          cmake --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install conan
        run: |
          python3 -m venv .python3/
          .python3/bin/pip install conan==2.33.0
          .python3/bin/pip install pygit2
          .python3/bin/conan --version
          .python3/bin/conan config install global.conf
      - name: Mark path as safe
        run: git config --global --add safe.directory $(pwd)
      - name: Check out main branch
        run: |
          git branch $GITHUB_BASE_REF origin/$GITHUB_BASE_REF
          git show-ref
        if: ${{ github.ref != 'refs/heads/main' }}
      - name: Install gnustep-helpers
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep-helpers'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install libdispatch
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'libdispatch'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install libobjc2
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'libobjc2'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install gnustep-make
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep-make'
          profile: '${{ github.workspace }}/profiles/linux-clang'
        # Build gnustep-base with a copy of ICU with static data packaging
      - name: Install gnustep-base
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep-base'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install gnustep-gui
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep-gui'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install gnustep-headless
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep-headless'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install gnustep-systempreferences
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep-systempreferences'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Install gnustep
        uses: ./.github/actions/conan-create
        with:
          conan: '.python3/bin/conan'
          conan-package: 'gnustep'
          profile: '${{ github.workspace }}/profiles/linux-clang'
      - name: Build tutorial
        run: |
          ../.python3/bin/conan install conanfile.txt --profile:a=../profiles/linux-clang --output-folder=build/
          cmake -S . -B build/ -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          . build/conanrun.sh
          ./build/Tutorial
        working-directory: tutorial/
      - name: Upload Conan packages to Cloudsmith
        run: |
          .python3/bin/conan remote add cloudsmith https://conan.cloudsmith.io/qmfrederik/gnustep/
          .python3/bin/conan remote login -p ${{ secrets.CLOUDSMITH_API_KEY }} cloudsmith ${{ secrets.CLOUDSMITH_USER }}
          .python3/bin/conan upload "libobjc2/*" --confirm -r cloudsmith
          .python3/bin/conan upload "libdispatch/*" --confirm -r cloudsmith
          .python3/bin/conan upload "gnustep*/*" --confirm -r cloudsmith
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload Conan packages to GitLab
        run: |
          .python3/bin/conan remote add gitlab https://gitlab.com/api/v4/projects/72962159/packages/conan
          .python3/bin/conan remote login -p ${{ secrets.GITLAB_API_KEY }} gitlab ${{ secrets.GITLAB_USER }}
          .python3/bin/conan upload "libobjc2/*" --confirm -r gitlab
          .python3/bin/conan upload "libdispatch/*" --confirm -r gitlab
          .python3/bin/conan upload "gnustep*/*" --confirm -r gitlab
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload Conan graph to GitHub artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conan-gnustep-linux-graph
          path: |
            ./*.json
